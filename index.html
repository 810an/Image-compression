<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图片压缩工具</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1100px;margin:20px auto;padding:0 16px}
.upload{border:2px dashed #4096ff;border-radius:12px;padding:40px;text-align:center;cursor:pointer;background:#f7faff}
.upload:hover{background:#ecf5ff}
#file{display:none}
.ctrl{margin:16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item{padding:12px;border:1px solid #eee;border-radius:8px;margin:8px 0}
img{max-width:120px;max-height:120px;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fill,160px);gap:12px;margin:16px 0}
button{padding:8px 16px;border:none;border-radius:6px;background:#4096ff;color:#fff;cursor:pointer}
button:disabled{background:#b3d8ff;cursor:not-allowed}
.info{color:#666;font-size:14px}
</style>
</head>
<body>
<h2>图片压缩-810</h2>
<div class="upload" id="drop">
  <p>点击或者拖放图片到这里批量上传</p>
  <input type="file" id="file" multiple accept="image/*">
</div>
<div class="ctrl">
  <label>压缩质量：<input type="range" id="quality" min="0.6" max="0.95" step="0.01" value="0.85"> <span id="qVal">0.85</span></label>
  <label>导出格式：
    <select id="outType">
      <option value="image/webp">WebP（推荐，同清晰度体积最小）</option>
      <option value="image/jpeg">JPG</option>
      <option value="image/png">PNG（PNG压缩效果差很多）</option>
    </select>
  </label>
  <button id="start">开始批量压缩</button>
  <button id="downloadAll" disabled>打包全部下载ZIP</button>
</div>
<div class="info">提示：质量0.8~0.9肉眼基本看不出模糊；PNG是无损/弱压缩，很难压小</div>
<div class="grid" id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
const $ = s=>document.querySelector(s), $$=s=>document.querySelectorAll(s)
const drop = $('#drop'), fileInput = $('#file'), list = $('#list')
const qualitySlider = $('#quality'), qVal = $('#qVal'), outType = $('#outType')
const startBtn = $('#start'), dlAllBtn = $('#downloadAll')
let filesRaw = []
let compressedBlobs = []

qualitySlider.oninput = ()=> qVal.textContent = qualitySlider.value

drop.onclick = ()=> fileInput.click()
drop.ondragover = e=>{e.preventDefault();drop.style.background='#e6f0ff'}
drop.ondragleave = ()=> drop.style.background='#f7faff'
drop.ondrop = e=>{
  e.preventDefault()
  drop.style.background='#f7faff'
  handleFiles(e.dataTransfer.files)
}
fileInput.onchange = ()=> handleFiles(fileInput.files)

function handleFiles(fs){
  filesRaw = Array.from(fs)
  list.innerHTML = ''
  compressedBlobs = []
  dlAllBtn.disabled = true
  filesRaw.forEach(f=>{
    const div = document.createElement('div')
    div.className='item'
    div.innerHTML = `<img><div>${f.name}</div><div class="info">${formatSize(f.size)}</div><div class="stat">等待压缩</div>`
    const img = div.querySelector('img')
    const reader = new FileReader()
    reader.onload = e=> img.src = e.target.result
    reader.readAsDataURL(f)
    list.appendChild(div)
  })
}

startBtn.onclick = async ()=>{
  startBtn.disabled = true
  compressedBlobs = []
  const q = Number(qualitySlider.value)
  const type = outType.value
  const items = $$('.item')
  for(let i=0;i<filesRaw.length;i++){
    const file = filesRaw[i]
    const statDom = items[i].querySelector('.stat')
    statDom.textContent = '压缩中…'
    try{
      const blob = await compressImage(file, q, type)
      compressedBlobs.push({name:file.name, blob})
      statDom.textContent = `✅ ${formatSize(blob.size)}  压缩率${(100-blob.size/file.size*100).toFixed(1)}%`
    }catch(err){
      statDom.textContent = '❌失败'
      console.error(err)
    }
  }
  dlAllBtn.disabled = false
  startBtn.disabled = false
}

dlAllBtn.onclick = async ()=>{
  const zip = new JSZip()
  compressedBlobs.forEach(item=> zip.file(item.name, item.blob))
  const zipBlob = await zip.generateAsync({type:'blob'})
  saveAs(zipBlob, 'compressed_images.zip')
}

function compressImage(file, quality, mimeType){
  return new Promise((resolve,reject)=>{
    const img = new Image()
    const reader = new FileReader()
    reader.onload = e=> img.src = e.target.result
    reader.onerror = reject
    img.onload = ()=>{
      const canvas = document.createElement('canvas')
      canvas.width = img.width
      canvas.height = img.height
      const ctx = canvas.getContext('2d')
      ctx.drawImage(img,0,0)
      canvas.toBlob(b=>b?resolve(b):reject('toBlob失败'), mimeType, quality)
    }
    img.onerror = reject
    reader.readAsDataURL(file)
  })
}

function formatSize(b){
  if(b<1024) return b+' B'
  if(b<1024*1024) return (b/1024).toFixed(1)+' KB'
  return (b/1024/1024).toFixed(2)+' MB'
}
</script>
</body>
</html>
